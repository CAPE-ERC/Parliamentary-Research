corpus:
  n_debates: 411
  raw_dir: data/raw
  processed_dir: data/processed

preprocessing:
  min_utterance_chars: 3
  language_id:
    min_reliable_chars: 20
    kreol_keywords: [mo, to, li, nou, zot, ou, pou, ena, pa, dan, sa, kot, kouma, kifer, zafer, bizin, gagne, fer, seki, sanla, komie, kitfoi, labous]

topic_layer:
  method: bertopic
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  min_topic_size: 100
  nr_topics: null
  exclude_stage_directions: true
  min_utterance_chars_for_topics: 10

procedural_layer:
  tags:
    - chair_ruling
    - interruption
    - withdrawal_request
    - so_citation
    - pnq_transfer

linking_layer:
  model: mixed_effects
  random_effects: [speaker, chair]

outcome_layer:
  method: granger
  max_lag: 3
